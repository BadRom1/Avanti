# Configuration golangci-lint v2 — voir https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m
  tests: true
  # Les globs depguard ci-dessous sont écrits relativement à la racine du dépôt.
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    dupl:
      threshold: 120

    errcheck:
      check-type-assertions: true
      check-blank: true

    gocyclo:
      min-complexity: 12

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # hugeParam et rangeValCopy réclament un pointeur dès qu'une structure
        # dépasse 80 octets. Toutes les entités de domaine d'Avanti les dépassent
        # — un User en fait 136, un Devis en fera davantage — et les deux checks
        # demandent donc de les manipuler par pointeur partout.
        #
        # C'est refusé pour la même raison que fieldalignment plus bas : la valeur
        # est ce qui rend une entité de domaine sûre à passer. Un `User` copié ne
        # peut pas être modifié dans le dos de son appelant, un port qui reçoit
        # `user User` ne peut pas garder une référence vers l'état d'un autre, et
        # une méthode à récepteur valeur ne peut pas muter l'agrégat. Échanger
        # cela contre l'économie de quelques dizaines d'octets, dans une
        # application qui sert deux personnes, serait un mauvais marché.
        - hugeParam
        - rangeValCopy

    govet:
      enable-all: true
      disable:
        # fieldalignment optimise l'empreinte mémoire au prix de la lisibilité de
        # structures métier qu'on veut pouvoir lire dans l'ordre du domaine.
        - fieldalignment

    misspell:
      locale: US
      # misspell corrige de l'anglais ; la documentation d'Avanti est en français.
      # Les mots ci-dessous sont du français correct que le dictionnaire anglais
      # prend pour des fautes de frappe. La liste grandit au fil de la prose : y
      # ajouter un mot est légitime, y ajouter un identifiant de code ne l'est pas
      # (le code reste en anglais, hors vocabulaire métier).
      ignore-rules:
        # Vocabulaire métier — le langage ubiquitaire du projet.
        - devis
        - artisans
        - statuts
        - facture
        - acompte
        - etape
        - jalon
        - artisan
        # « cheque » est la valeur française du moyen de paiement
        # (finance.MoyenCheque), stockée en base et visible telle quelle.
        - cheque
        # Français courant homographe de fautes anglaises.
        - absolue
        - accumule
        - analyse
        - architecte
        - centre
        - attribue
        - attributs
        - catalogue
        - catalogues
        - commandes
        - compteurs
        - concret
        - conflit
        - confortable
        - connexion
        - connexions
        - continuent
        - correspondant
        - davantage
        - demande
        - demandes
        - existantes
        - factorise
        - portait
        - distincte
        - enveloppe
        - enveloppes
        - exemple
        - existant
        - inventer
        - inventee
        - manipule
        - neutralisation
        - normalisation
        - partiel
        - partielle
        - persistance
        - pointeur
        - programme
        - recommandation
        - recommande
        - respecte
        - restauration
        - substitue
        - attendent
        - combinaison
        - confidentiel
        - conjonction
        - permise
        - finisse
        - normalise
        - origines
        - sinistre
        - terminaison
        - trafic
        - transforme
        - utilisable
        - utilisation
        - utilise

        # Fragments, pas des mots : misspell coupe sur les caractères accentués,
        # « intermédiaire » lui parvient donc en « interm » + « diaire » et
        # « démarrage » en « d » + « marrage ». Ne pas les « corriger » en mots
        # entiers — la forme tronquée est celle que misspell compare.
        - activit
        - interm
        - journalis
        - marrage
        - normalis
        - strat
        - tournements

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments

    staticcheck:
      checks:
        - all

    # depguard encode les frontières de l'architecture hexagonale décrites dans
    # docs/ARCHITECTURE.md (R1, R3, R4). Toute violation fait échouer le lint,
    # donc la CI, donc la fusion.
    #
    # --- Pourquoi des listes d'autorisation plutôt que d'interdiction
    #
    # Une liste deny énumère l'interdit : ce qu'on oublie d'y écrire devient
    # autorisé, en silence. Une liste allow énumère le permis : ce qu'on oublie
    # d'y écrire devient interdit, bruyamment, au premier import. Les deux
    # demandent le même entretien — seule la direction de l'échec change, et un
    # échec bruyant se corrige en une minute là où une brèche silencieuse
    # survit des mois. D'où le `list-mode: strict` de chaque règle ci-dessous :
    # un import est refusé sauf s'il figure dans `allow`.
    #
    # L'unique entrée `deny` de chaque règle ne bloque rien de plus que la
    # liste allow : elle ne sert qu'à attacher un message d'explication au
    # refus, depguard remontant le `desc` de l'entrée deny correspondante.
    # L'entrée allow, plus spécifique (préfixe plus long), l'emporte sur elle —
    # c'est ce qui laisse passer les imports légitimes du dépôt.
    #
    # --- Comment ajouter quelque chose
    #
    #   Une bibliothèque tierce : l'ajouter au `allow` des seules règles qui en
    #   ont besoin. Un domaine n'accepte qu'une bibliothèque métier sans effet
    #   de bord, et c'est volontairement une décision visible en revue.
    #
    #   Une aide réservée aux tests (testcontainers, testify et consorts) :
    #   l'ajouter à la règle `<nom>-test` du répertoire, bornée aux fichiers
    #   *_test.go — la créer sur le modèle de `socle-platform-test` si elle
    #   n'existe pas encore. Le code de production ne peut ainsi pas
    #   l'importer, même par inadvertance.
    #
    #   Un domaine : créer sa règle `domaine-<nom>`, puis l'ajouter au `allow`
    #   des six règles `adapter-*`. En oublier une ne crée pas de brèche : le
    #   premier adapter qui voudra ce domaine se fera refuser l'import.
    #
    #   Une famille d'adapters : créer sa règle `adapter-<famille>` en copiant
    #   sa voisine, puis l'exclure de `garde-fou-package-non-declare`. Tant que
    #   ce n'est pas fait, la famille ne voit que la bibliothèque standard.
    #
    # cmd/avanti n'a délibérément aucune règle de frontière : c'est
    # l'assembleur, le seul endroit du dépôt autorisé à connaître les domaines
    # et les adapters à la fois (R4). Seule `tout-le-depot` s'y applique.
    depguard:
      rules:
        # --- Domaines : bibliothèque standard et eux-mêmes, rien d'autre (R1)

        domaine-devis:
          list-mode: strict
          files:
            - "${base-path}/internal/devis/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/devis
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un domaine n'importe rien d'autre du dépôt (R1) — un autre domaine se référence par identifiant faible (Facture.devisID), un besoin technique se déclare en port que cmd/ implémente, la config et le logger arrivent en paramètres de construction"

        domaine-planning:
          list-mode: strict
          files:
            - "${base-path}/internal/planning/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/planning
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un domaine n'importe rien d'autre du dépôt (R1) — un autre domaine se référence par identifiant faible (Etape.devisID), un besoin technique se déclare en port que cmd/ implémente, la config et le logger arrivent en paramètres de construction"

        domaine-finance:
          list-mode: strict
          files:
            - "${base-path}/internal/finance/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/finance
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un domaine n'importe rien d'autre du dépôt (R1) — un autre domaine se référence par identifiant faible (Facture.devisID), un besoin technique se déclare en port que cmd/ implémente, la config et le logger arrivent en paramètres de construction"

        domaine-document:
          list-mode: strict
          files:
            - "${base-path}/internal/document/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/document
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un domaine n'importe rien d'autre du dépôt (R1) — la cible d'une pièce est un couple (type, identifiant), le contenu binaire part vers un port de stockage qu'adapters/storage implémente, la config et le logger arrivent en paramètres"

        domaine-identity:
          list-mode: strict
          files:
            - "${base-path}/internal/identity/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/identity
            # Bibliothèque métier sans effet de bord, admise dans le domaine (R1).
            #
            # argon2id est *la* décision de docs/ARCHITECTURE.md §6 sur les mots
            # de passe, et une décision de sécurité n'a pas à être rejouable de
            # l'extérieur : la mettre derrière un port réglable par la
            # configuration reviendrait à offrir un moyen de l'affaiblir. La
            # bibliothèque ne fait ni entrée-sortie, ni réseau, ni horloge — elle
            # calcule, et tire un sel dans crypto/rand. Elle laisse donc le
            # domaine testable en Go pur, sans rien monter à côté.
            #
            # Le domaine expose tout de même le port identity.Hacheur, pour une
            # autre raison : un argon2id correct est lent par construction, et les
            # tests unitaires y substituent une implémentation triviale pour
            # rester utilisables sous `make mutation`.
            - github.com/alexedwards/argon2id
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un domaine n'importe rien d'autre du dépôt (R1) — identity expose des comptes et des scopes, la mécanique OAuth 2.1 vit dans adapters/web, la config et le logger arrivent en paramètres de construction"

        # --- Socle technique : bibliothèque standard et lui-même (R3)
        #
        # Les bibliothèques techniques du socle (pgx, scs, goose…) s'ajoutent
        # explicitement ci-dessous au fur et à mesure des lots.

        socle-platform:
          list-mode: strict
          files:
            - "${base-path}/internal/platform/**"
            - "!${base-path}/internal/platform/*_test.go"
            - "!${base-path}/internal/platform/**/*_test.go"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/platform
            # pgx : le pilote PostgreSQL retenu (docs/ARCHITECTURE.md §6). Le
            # sous-paquet stdlib sert à présenter le pool en *sql.DB, seul
            # dialecte que goose comprenne.
            - github.com/jackc/pgx/v5
            # goose : moteur de migrations, alimenté par un embed.FS.
            - github.com/pressly/goose/v3
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "platform est le socle technique (R3) — il ne connaît ni domaine ni adapter, la dépendance va toujours dans l'autre sens"

        # Les tests du socle voient, en plus, testcontainers pour lever un
        # PostgreSQL jetable. La règle est bornée aux *_test.go : un import de
        # testcontainers dans du code de production est rejeté par le lint, au
        # lieu de reposer sur la vigilance en revue.
        socle-platform-test:
          list-mode: strict
          files:
            - "${base-path}/internal/platform/*_test.go"
            - "${base-path}/internal/platform/**/*_test.go"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/platform
            - github.com/jackc/pgx/v5
            - github.com/pressly/goose/v3
            - github.com/testcontainers/testcontainers-go
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "les tests du socle suivent R3 comme le code qu'ils testent"

        # --- Adapters : une règle par famille (R4)
        #
        # Chaque famille voit la bibliothèque standard, elle-même, les cinq
        # domaines et internal/platform — jamais une autre famille. C'est ce qui
        # rend R4 structurelle : le seul point où deux familles se rencontrent
        # est cmd/avanti. Les bibliothèques tierces propres à une famille
        # (pgx pour postgres, le SDK MCP pour mcp…) s'ajoutent à son `allow`.

        adapter-postgres:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/postgres/**"
            - "!${base-path}/internal/adapters/postgres/*_test.go"
            - "!${base-path}/internal/adapters/postgres/**/*_test.go"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/postgres
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
            # pgx : le pilote PostgreSQL retenu (docs/ARCHITECTURE.md §6). C'est
            # ici, dans les dépôts, qu'il sert à écrire le SQL réel ; le socle,
            # lui, n'en tient que le pool.
            - github.com/jackc/pgx/v5
            # fosite : le serveur d'autorisation OAuth 2.1 (docs/ARCHITECTURE.md
            # §6). Ici n'entrent que ses *interfaces de stockage* — clients,
            # codes, jetons, sessions PKCE — que cet adapter implémente en SQL.
            # La mécanique du protocole, elle, vit dans adapters/web.
            #
            # Les deux familles voient donc fosite sans se voir l'une l'autre :
            # c'est cmd/avanti qui construit ce magasin et l'injecte dans le
            # fournisseur web (R4). fosite est le vocabulaire commun, pas un
            # chemin d'import entre familles.
            - github.com/ory/fosite
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un adapter ne connaît que les domaines, internal/platform et sa propre famille (R4) — une famille d'adapters n'en importe pas une autre, leur seul point de rencontre est cmd/avanti"

        # Les tests de l'adapter postgres voient, en plus, testcontainers : du SQL
        # ne se vérifie que contre un vrai PostgreSQL. Même dispositif que
        # socle-platform-test, et pour la même raison : la règle est bornée aux
        # *_test.go, de sorte qu'un import de testcontainers dans du code de
        # production soit rejeté par le lint plutôt que par la vigilance en revue.
        adapter-postgres-test:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/postgres/*_test.go"
            - "${base-path}/internal/adapters/postgres/**/*_test.go"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/postgres
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
            - github.com/jackc/pgx/v5
            - github.com/ory/fosite
            - github.com/testcontainers/testcontainers-go
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "les tests d'un adapter suivent R4 comme le code qu'ils testent"

        adapter-web:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/web/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/web
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
            # go-i18n : catalogue de messages, seule façon d'écrire du texte
            # affiché (docs/ARCHITECTURE.md §6).
            - github.com/nicksnyder/go-i18n/v2
            # golang.org/x/text : les étiquettes de langue que go-i18n manipule.
            - golang.org/x/text/language
            # scs : sessions serveur (docs/ARCHITECTURE.md §6). Seule l'interface
            # scs.Store et le gestionnaire de sessions entrent ici — la politique
            # du cookie est une décision de l'interface web, donc sa place est
            # bien celle-ci. Le magasin PostgreSQL concret (pgxstore) est choisi
            # par cmd/avanti et arrive en paramètre, ce qui laisse cet adapter
            # ignorant de pgx.
            - github.com/alexedwards/scs/v2
            # fosite : le serveur d'autorisation OAuth 2.1 (docs/ARCHITECTURE.md
            # §6). C'est ici qu'il sert, parce que la mécanique OAuth est une
            # surface HTTP — points de terminaison, page de consentement,
            # document de métadonnées — et que cet adapter est déjà celui qui
            # tient les sessions dont le consentement a besoin.
            #
            # Le magasin concret, lui, est celui d'adapters/postgres : il arrive
            # en paramètre sous la forme des interfaces de stockage de fosite,
            # exactement comme scs.Store plus haut, et laisse donc cet adapter
            # ignorant de pgx.
            - github.com/ory/fosite
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un adapter ne connaît que les domaines, internal/platform et sa propre famille (R4) — une famille d'adapters n'en importe pas une autre, leur seul point de rencontre est cmd/avanti"

        adapter-mcp:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/mcp/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/mcp
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
            # go-sdk : le SDK MCP officiel (docs/ARCHITECTURE.md §6). C'est ici
            # qu'il sert, et ici seulement : le serveur MCP est une surface de
            # transport, exactement comme fosite est celle de l'adapter web.
            # Trois sous-paquets entrent : mcp (serveur, tools, transport HTTP
            # streamable), auth (vérification du Bearer, RFC 6750/9728) et
            # oauthex (le document Protected Resource Metadata). L'identité, elle,
            # arrive par le port identity.TokenVerifier — cet adapter ne sait pas
            # que fosite existe, et aucun domaine ne voit le vocabulaire MCP.
            - github.com/modelcontextprotocol/go-sdk
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un adapter ne connaît que les domaines, internal/platform et sa propre famille (R4) — une famille d'adapters n'en importe pas une autre, leur seul point de rencontre est cmd/avanti"

        adapter-storage:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/storage/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/storage
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
            # minio-go : le client S3-compatible du second adapter de stockage,
            # celui qui démontre le modèle d'extension (docs/ARCHITECTURE.md
            # §3). Un client léger et sans framework, là où le SDK AWS complet
            # tirerait des dizaines de modules pour trois opérations (PUT, GET,
            # DELETE). Ici seulement : le port document.Storage est le point
            # d'extension, et le vocabulaire S3 n'a rien à faire ailleurs — ni
            # dans le domaine (R1), ni dans une autre famille d'adapters (R4).
            - github.com/minio/minio-go/v7
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un adapter ne connaît que les domaines, internal/platform et sa propre famille (R4) — une famille d'adapters n'en importe pas une autre, leur seul point de rencontre est cmd/avanti"

        adapter-mail:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/mail/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/mail
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un adapter ne connaît que les domaines, internal/platform et sa propre famille (R4) — une famille d'adapters n'en importe pas une autre, leur seul point de rencontre est cmd/avanti"

        adapter-export:
          list-mode: strict
          files:
            - "${base-path}/internal/adapters/export/**"
          allow:
            - $gostd
            - github.com/Romain-Badino/Avanti/internal/adapters/export
            - github.com/Romain-Badino/Avanti/internal/devis
            - github.com/Romain-Badino/Avanti/internal/document
            - github.com/Romain-Badino/Avanti/internal/finance
            - github.com/Romain-Badino/Avanti/internal/identity
            - github.com/Romain-Badino/Avanti/internal/planning
            - github.com/Romain-Badino/Avanti/internal/platform
            # fpdf : le générateur PDF du dossier d'assurance, implémentation du
            # port finance.ExportFormat (second point d'extension officiel,
            # docs/ARCHITECTURE.md §3). L'adresse codeberg.org est l'adresse
            # canonique actuelle du module — l'ancien github.com/go-pdf/fpdf
            # s'est arrêté à v0.9.0, le développement continue sur Codeberg. En
            # Go pur, sans dépendance système ni réseau : il écrit des octets
            # dans un io.Writer, rien d'autre. Ici seulement : le vocabulaire
            # PDF n'a rien à faire ni dans le domaine (R1), ni dans une autre
            # famille d'adapters (R4).
            - codeberg.org/go-pdf/fpdf
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "un adapter ne connaît que les domaines, internal/platform et sa propre famille (R4) — une famille d'adapters n'en importe pas une autre, leur seul point de rencontre est cmd/avanti"

        # --- Garde-fou : tout package interne non déclaré ci-dessus
        #
        # Sans cette règle, créer internal/quelquechose/ le placerait hors de
        # toute frontière, sans que rien ne le signale — exactement la brèche
        # silencieuse que les listes allow servent à éviter. Ici l'oubli se
        # remarque tout de suite : le nouveau package ne voit que la
        # bibliothèque standard tant que sa propre règle n'existe pas.
        garde-fou-package-non-declare:
          list-mode: strict
          files:
            - "${base-path}/internal/**"
            - "!${base-path}/internal/devis/**"
            - "!${base-path}/internal/planning/**"
            - "!${base-path}/internal/finance/**"
            - "!${base-path}/internal/document/**"
            - "!${base-path}/internal/identity/**"
            - "!${base-path}/internal/platform/**"
            - "!${base-path}/internal/adapters/postgres/**"
            - "!${base-path}/internal/adapters/web/**"
            - "!${base-path}/internal/adapters/mcp/**"
            - "!${base-path}/internal/adapters/storage/**"
            - "!${base-path}/internal/adapters/mail/**"
            - "!${base-path}/internal/adapters/export/**"
          allow:
            - $gostd
          deny:
            - pkg: "github.com/Romain-Badino/Avanti/"
              desc: "ce package interne n'a pas de règle depguard, donc pas de frontière vérifiée — déclarez-la dans .golangci.yml (copiez la règle la plus proche) et retirez le package du garde-fou"

        # --- Interdictions transverses, cmd/avanti compris
        #
        # Seule règle en mode deny du fichier, et c'est volontaire : son objet
        # n'est pas de borner un périmètre mais de bannir quelques paquets
        # précis partout, y compris là où aucune frontière ne s'applique.
        tout-le-depot:
          list-mode: original
          files:
            - $all
          deny:
            - pkg: math/rand$
              desc: "utilisez math/rand/v2, ou crypto/rand pour tout ce qui touche à la sécurité"
            - pkg: github.com/pkg/errors
              desc: "utilisez errors et fmt.Errorf avec %w de la bibliothèque standard"
            - pkg: github.com/sirupsen/logrus
              desc: "la journalisation passe par log/slog via internal/platform"
            - pkg: io/ioutil
              desc: "paquet déprécié : utilisez os et io"

  exclusions:
    generated: lax
    rules:
      # Les tests peuvent se répéter et n'ont pas besoin des mêmes garde-fous
      # que le code de production.
      - path: _test\.go
        linters:
          - dupl
          - gocyclo
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/Romain-Badino/Avanti
